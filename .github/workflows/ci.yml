name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-tests:
    name: fast-tests (unit + integration + contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        working-directory: qa-automation-suite
        run: pip install -r requirements-test.txt

      - name: Run unit, integration, and contract tests
        working-directory: qa-automation-suite
        run: pytest tests/unit tests/integration tests/contract --cov=app --cov-report=term-missing --cov-fail-under=90

  full-stack-tests:
    name: full-stack-tests (containerized, real Postgres, incl. e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run full suite against the real Dockerized stack
        run: >
          docker compose
          -f service/docker-compose.yml
          -f qa-automation-suite/docker-compose.test.yml
          up --build --abort-on-container-exit --exit-code-from tests tests

      - name: Tear down
        if: always()
        run: >
          docker compose
          -f service/docker-compose.yml
          -f qa-automation-suite/docker-compose.test.yml
          down
